name: DART iOS — TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CERTIFICATE_BASE64:
        required: true
      CERTIFICATE_PASSWORD:
        required: true
      ASC_KEY_CONTENT:
        required: true
      DART_PROFILE_BASE64:
        required: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dart-src

    steps:
      - name: Checkout DART-iOS
        uses: actions/checkout@v4
        with:
          repository: DART-Skyboard/DART-iOS
          path: dart-src

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
        working-directory: .

      - name: Install ASC key
        working-directory: .
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          echo "Key size: $(wc -c < ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8) bytes"

      - name: Install cert + DART profile
        working-directory: .
        env:
          CERTIFICATE_BASE64:   ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          DART_PROFILE_BASE64:  ${{ secrets.DART_PROFILE_BASE64 }}
        run: |
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$DART_PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/DARTGitHubFlow.mobileprovision
          echo "Profiles installed:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install xcodegen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_extracted
          sudo cp /tmp/xcodegen_extracted/xcodegen/bin/xcodegen /usr/local/bin/xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme DARTApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/DART.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM=L7AHWS9Q6V \
            PROVISIONING_PROFILE_SPECIFIER=DARTGitHubFlow
          ls $RUNNER_TEMP/DART.xcarchive/

      - name: Export IPA
        working-directory: .
        run: |
          APP=$(find $RUNNER_TEMP/DART.xcarchive -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP && zip -qr DART.ipa Payload/
          echo "IPA: $(du -sh $RUNNER_TEMP/DART.ipa)"

      - name: Upload to TestFlight
        working-directory: .
        run: |
          RESULT=$(xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/DART.ipa \
            --apiKey NQXQ595W59 \
            --apiIssuer 90056871-d791-45f6-a770-21399c45e491 \
            --apiKeyPath ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8 2>&1)
          echo "$RESULT"
          if echo "$RESULT" | grep -iE "UPLOAD FAILED|State_Error|Validation failed|^.*ERROR:" | grep -v "No errors"; then
            echo "Upload failed — see above"; exit 1
          fi
          echo "✓ DART upload accepted"
